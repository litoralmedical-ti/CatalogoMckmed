<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo MCKMED</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Mulish:ital,wght@0,400;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/catalogo.css?v=3">
</head>
<body>
  <header class="top">
    <img src="logo.jpg" alt="Logo MCKMED">
    <b>MCKMED</b>
    <span>Catálogo de produtos</span>
    <div class="ind" id="ind">Capa</div>
  </header>

  <main id="stage" aria-label="Catálogo folheável"></main>

  <nav class="ctrl">
    <button id="prev" aria-label="Página anterior">‹<span class="lbl"> Anterior</span></button>
    <button class="sum" id="sum">Sumário</button>
    <input type="range" id="jump" min="0" max="6" value="0" aria-label="Ir para a página">
    <button id="next" class="main" aria-label="Próxima página"><span class="lbl">Próxima </span>›</button>
  </nav>

  <!-- a ordem importa: biblioteca → dados → páginas → livro -->
  <script src="js/vendor/page-flip.browser.js?v=3"></script>
  <script src="js/ilustracoes.js?v=3"></script>
  <script src="js/produtos.js?v=3"></script>
  <script src="js/paginas.js?v=3"></script>
  <script src="js/livro.js?v=3"></script>
</body>
</html>
